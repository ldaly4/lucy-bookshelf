  <meta property="og:image" content="https://ldaly4.github.io/lucy-bookshelf/assets/social-preview.png">

<body>
  <a class="skip-link" href="#bookshelf">Skip to the books</a>
  <header class="topbar"><h1 class="site-name">Lucy Maria Daly</h1></header>
  <main id="home">
    <section class="keepsake-shelf" aria-label="A shelf of keepsakes">
      <div class="keepsake-objects">
        <img class="trailing-plant" src="assets/trimmed-pothos.webp" alt="" width="700" height="631" decoding="async">
        <div class="photo-frame">
          <div id="shelf-photo" class="photo-mat"><div class="photo-placeholder" aria-hidden="true"></div><span class="sr-only">A frame ready for Lucy’s photograph.</span></div>
        </div>
        <div class="stained-glass" aria-hidden="true"><img class="glass-art" src="assets/stained-glass.webp" alt="" width="500" height="608" decoding="async"></div>
      </div>
      <div class="shelf" aria-hidden="true"><span></span><img class="shelf-bracket" src="assets/shelf-bracket.svg" alt="" width="52" height="65"><img class="shelf-bracket bracket-right" src="assets/shelf-bracket.svg" alt="" width="52" height="65"></div>
      <div class="shelf-shadow" aria-hidden="true"></div>
    </section>
    <section class="library" aria-label="Nine books about my life">
      <div class="shelf-scene">
        <div id="bookshelf" class="books" tabindex="-1" aria-label="Choose a book"></div>
        <div class="shelf" aria-hidden="true"><span></span><img class="shelf-bracket" src="assets/shelf-bracket.svg" alt="" width="52" height="65"><img class="shelf-bracket bracket-right" src="assets/shelf-bracket.svg" alt="" width="52" height="65"></div>
        <div class="shelf-shadow" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <dialog id="reader" aria-labelledby="book-title"><div class="reader-shell"><div class="reader-toolbar"><button id="close-book" class="chunky close">← Back to shelf</button><button id="reader-sound" class="sound" aria-pressed="false" aria-label="Turn sounds on">♪ <span>sound off</span></button></div><div class="book-binding"><div id="spread" class="spread"></div><div id="turn-sheet" class="turn-sheet" aria-hidden="true" inert></div></div><nav class="page-controls" aria-label="Book pages"><button id="previous" class="chunky page-arrow" aria-label="Previous page">←</button><span id="position" role="status" aria-live="polite"></span><button id="next" class="chunky page-arrow" aria-label="Next page">→</button></nav><p class="reader-hint">Use the arrows, turn a corner, or swipe to explore.</p></div></dialog>
  <p class="sr-only" id="announcement" role="status"></p>
  <noscript><p class="noscript">Please enable JavaScript to open the scrapbook books. Lucy Maria Daly’s nine books cover Work History, University (and building cool cars), Communities, VapeBox, Water Projects, Software Projects, Hardware Projects, Arts and Crafts, and About me.</p></noscript>
</body>
</html>
